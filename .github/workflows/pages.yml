name: Publish rumb
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  # Every state but the two committed ones (Mississippi, Delaware), and the
  # national counties, built by the R pipeline in six shards balanced by tract
  # count. Downloads are pinned
  # in scripts/sources/ and checked; both the downloads and each shard's output
  # are cached, so a run without data changes rebuilds nothing.
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - id: states
        run: echo "ids=$(node scripts/shards.mjs ${{ matrix.shard }} 6)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        id: built
        with:
          path: .cache/data
          key: data-${{ matrix.shard }}-${{ hashFiles('scripts/**', 'renv.lock', 'public/data/ms/catalog.json', 'public/data/shared/**') }}
      - name: System libraries for sf
        if: steps.built.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      - uses: r-lib/actions/setup-r@v2
        if: steps.built.outputs.cache-hit != 'true'
        with:
          r-version: 4.5.0
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
        if: steps.built.outputs.cache-hit != 'true'
      - uses: actions/cache@v6.1.0
        if: steps.built.outputs.cache-hit != 'true'
        with:
          path: .cache/sources
          key: sources-${{ matrix.shard }}-${{ hashFiles('scripts/sources/**', 'scripts/tables.json', 'scripts/layers.json') }}
          restore-keys: sources-${{ matrix.shard }}-
      - name: Build ${{ steps.states.outputs.ids }}
        if: steps.built.outputs.cache-hit != 'true'
        run: node scripts/build-regions.mjs ${{ steps.states.outputs.ids }} --keep --jobs 2
      - name: Check every state
        run: node scripts/check-region.mjs $(for id in ${{ steps.states.outputs.ids }}; do echo .cache/data/$id; done)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: data-${{ matrix.shard }}
          path: .cache/data
          retention-days: 3
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: data-logs-${{ matrix.shard }}
          path: .cache/build/*/build.log

  # The pipeline must still produce the committed regions: rebuild Mississippi
  # and Delaware and compare them with public/data by meaning.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 4.5.0
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - uses: actions/cache@v6.1.0
        with:
          path: .cache/sources
          key: sources-verify-${{ hashFiles('scripts/sources/**', 'scripts/tables.json', 'scripts/layers.json') }}
          restore-keys: sources-verify-
      - run: node scripts/build-regions.mjs ms de --out-root .cache/verify --jobs 2
      # Values, ids, neighbors and tables must match exactly. Coordinates may
      # differ by 2e-4° (about 20 m): Linux's GDAL and GEOS simplify and round
      # some display vertices differently from the machine that built them.
      - run: Rscript scripts/compare-region.R public/data/ms .cache/verify/ms --geometry 2e-4
      - run: Rscript scripts/compare-region.R public/data/de .cache/verify/de --geometry 2e-4
        if: success() || failure()
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: verify-logs
          path: .cache/build/*/build.log
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: verify-rebuild
          path: .cache/verify
          retention-days: 7

  # The national tract map: tippecanoe 2.79.0, built from its pinned source
  # tarball and cached, draws every state's tracts into one PMTiles file, and
  # prepare-tract-values.R gathers their values (scripts/build-tiles.mjs).
  # Only us/tiles/ is uploaded; the build job checks it and merges it.
  tiles:
    needs: [data]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TIPPECANOE_VERSION: 2.79.0
      TIPPECANOE_SHA256: b0fd9df49b6efc988288ea48774822c6de19eb48428017f27ee0b3b01d44f05d
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: data-*
          path: .cache/data
          merge-multiple: true
      - uses: actions/cache@v6.1.0
        id: tippecanoe
        with:
          path: ~/.local/tippecanoe
          key: tippecanoe-${{ env.TIPPECANOE_VERSION }}-${{ env.TIPPECANOE_SHA256 }}
      - name: Build tippecanoe ${{ env.TIPPECANOE_VERSION }}
        if: steps.tippecanoe.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev zlib1g-dev
          curl --fail --location --output /tmp/tippecanoe.tar.gz \
            "https://github.com/felt/tippecanoe/archive/refs/tags/${TIPPECANOE_VERSION}.tar.gz"
          echo "${TIPPECANOE_SHA256}  /tmp/tippecanoe.tar.gz" | sha256sum --check
          tar -xzf /tmp/tippecanoe.tar.gz -C /tmp
          make -C "/tmp/tippecanoe-${TIPPECANOE_VERSION}" -j "$(nproc)"
          make -C "/tmp/tippecanoe-${TIPPECANOE_VERSION}" install PREFIX="$HOME/.local/tippecanoe"
      - run: echo "$HOME/.local/tippecanoe/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update && sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 4.5.0
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      # Mississippi and Delaware are committed; every other state comes from the data job.
      - name: Build the national tract tiles
        run: |
          dirs=$(node -e 'const r = require("./scripts/regions.json").regions; console.log(r.map((s) => (["ms", "de"].includes(s.id) ? "public/data/" : ".cache/data/") + s.id).join(" "))')
          node scripts/build-tiles.mjs --out .cache/data/us $dirs
          mkdir -p .cache/tiles/us && cp -R .cache/data/us/tiles .cache/tiles/us/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: data-tiles
          path: .cache/tiles
          retention-days: 3

  build:
    needs: [data, verify, tiles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: data-*
          path: .cache/data
          merge-multiple: true
      - run: npm ci
      - run: npm test
      # Every tract at the lowest and highest zoom, no tile over 1 MB, tiles under 150 MB.
      - run: node scripts/check-tiles.mjs public/data/de .cache/data/us
      - run: npm run build
        env:
          RUMB_REGIONS: .cache/data
      - name: Fits GitHub Pages
        run: node scripts/check-size.mjs dist 900
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy
        id: publish
        uses: actions/deploy-pages@v5.0.1
